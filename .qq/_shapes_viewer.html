<!doctype html>
<!-- qq shapes' asset catalogue (_shapes_view.py, _shapes_catalog.py): copied to .tmp/shapes/viewer.html and opened
     from disk. It loads viewer-data.js, and loads it again whenever viewer-stamp.js, read every second, says it was
     written again; a model's triangles and pictures are scripts under viewer-cache/, loaded when it is first shown. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>asset catalogue</title>
<style>
  :root { --bg: #2b2b2b; --panel: #1d1d1d; --line: #3a3a3a; --text: #cfcfcf; --dim: #8a8a8a; --hot: #e0a030;
          --sel: #40b0e0; --bad: #e05040; --ok: #60c070; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template: "head head head" auto "filters list detail" 1fr
         / 230px minmax(320px, 1fr) 640px; background: var(--bg); color: var(--text);
         font: 12px/1.4 ui-monospace, monospace; }
  header { grid-area: head; display: flex; gap: 10px; align-items: center; padding: 6px 10px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 13px; margin: 0; letter-spacing: .1em; white-space: nowrap; }
  #q { flex: 1; max-width: 520px; font: inherit; color: var(--text); background: #151515; border: 1px solid #484848;
       padding: 4px 8px; }
  #q:focus { outline: none; border-color: var(--hot); }
  select { font: inherit; color: var(--text); background: #2f2f2f; border: 1px solid #484848; padding: 2px; }
  #filters { grid-area: filters; background: var(--panel); border-right: 1px solid var(--line); overflow: auto;
             padding: 8px 10px; }
  #list { grid-area: list; overflow: auto; padding: 10px; }
  #detail { grid-area: detail; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; }
  h2 { font-size: 11px; margin: 14px 0 4px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
  #filters h2:first-child { margin-top: 2px; }
  button { font: inherit; color: var(--text); background: #2f2f2f; border: 1px solid #484848; padding: 3px 7px;
           cursor: pointer; }
  button:hover { border-color: var(--hot); }
  button.on { background: #4a3b1c; border-color: var(--hot); }
  .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chip { display: inline-block; padding: 1px 6px; border: 1px solid #484848; background: #262626; cursor: pointer;
          margin: 0 3px 3px 0; white-space: nowrap; }
  .chip:hover { border-color: var(--hot); }
  .chip.on { background: #4a3b1c; border-color: var(--hot); }
  .chip.zero { color: #5c5c5c; }
  .chip small { color: var(--dim); }
  .kind { display: inline-block; padding: 0 5px; border-radius: 2px; font-size: 11px; color: #111; }
  .k-material { background: #8a8a8a; } .k-face { background: #e0a030; } .k-decal { background: #d0c060; }
  .k-part { background: #60b0d0; } .k-device { background: #70c080; } .k-draft { background: #b080d0; }
  .over { color: var(--bad); } .dim, small { color: var(--dim); } .warn { color: var(--hot); }
  .err { color: var(--bad); white-space: pre-wrap; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--line); background: #212121; cursor: pointer; padding: 6px; min-width: 0; }
  .card:hover { border-color: var(--hot); }
  .card.sel { border-color: var(--sel); background: #24303a; }
  .card .pic { height: 110px; display: flex; align-items: center; justify-content: center; }
  .card .id { overflow-wrap: anywhere; margin-top: 4px; }
  .card .meta { display: flex; justify-content: space-between; gap: 4px; margin-top: 2px; white-space: nowrap;
                font-size: 11px; }
  .checker { background: repeating-conic-gradient(#3a3a3a 0 25%, #303030 0 50%) 0 0 / 12px 12px; }
  .pic img { max-width: 100%; max-height: 100%; display: block; }
  .group { margin: 4px 0 8px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; font-size: 11px; }
  .head { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 10px; }
  .head .pic { height: 150px; display: flex; align-items: center; justify-content: center; }
  .head h3 { margin: 0 0 4px; font-size: 14px; overflow-wrap: anywhere; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 4px 0; }
  dt { color: var(--dim); } dd { margin: 0; overflow-wrap: anywhere; }
  .cmd { background: #151515; border: 1px solid var(--line); padding: 3px 6px; cursor: copy; overflow-wrap: anywhere; }
  #stage { position: relative; height: 340px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
           background: #2b2b2b; }
  #stage.none { display: none; }
  canvas#gl { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 8px; top: 6px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #pick { color: var(--hot); }
  #gizmo { position: absolute; left: 6px; bottom: 34px; width: 70px; height: 70px; pointer-events: none; }
  #stagebar { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; background: #1d1d1dcc; }
  #stagebar button { padding: 1px 5px; }
  #error { position: absolute; inset: 30px; color: var(--bad); white-space: pre-wrap; pointer-events: none; }
  .tabs { position: sticky; top: 0; background: var(--panel); display: flex; gap: 2px; padding: 6px 10px;
          border-bottom: 1px solid var(--line); z-index: 1; }
  .tabs button { flex: 1; }
  #tab { padding: 0 10px 20px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 2px 4px; border-bottom: 1px solid var(--line); vertical-align: top;
           overflow-wrap: anywhere; }
  th { color: var(--dim); font-weight: normal; }
  td img.mini { height: 36px; max-width: 72px; object-fit: contain; vertical-align: middle; }
  tr.hot td, li.hot, .tile.hot { background: #3a3020; }
  tr.cur td { background: #24303a; }
  .link { color: var(--sel); cursor: pointer; }
  .num { text-align: right; white-space: nowrap; overflow-wrap: normal; }
  tr.retry td, .retry-text { color: var(--hot); }
  tr.idle td { color: var(--dim); }
  dl.figures { grid-template-columns: 96px 1fr; gap: 6px 10px; }
  .total { font-size: 14px; color: var(--hot); }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #151515; padding: 6px; margin: 4px 0;
        border: 1px solid var(--line); max-height: 420px; overflow: auto; }
  details summary { cursor: pointer; color: var(--dim); margin-top: 4px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 2px 4px; cursor: pointer; border-left: 2px solid transparent; overflow-wrap: anywhere; }
  li:hover { border-left-color: var(--hot); background: #262626; }
  li.sel { border-left-color: var(--sel); background: #24303a; }
  li.off .name { color: #5c5c5c; text-decoration: line-through; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
  .tile { border: 1px solid var(--line); padding: 4px; cursor: pointer; background: #212121; min-width: 0; }
  .tile:hover { border-color: var(--hot); }
  .tile .pic { height: 70px; display: flex; align-items: center; justify-content: center; }
  .tile div { overflow-wrap: anywhere; }
  .pics { display: flex; flex-wrap: wrap; gap: 8px; }
  .pics figure { margin: 0; max-width: 190px; }
  .pics .pic { height: 140px; display: flex; align-items: center; justify-content: center; }
  .pics figcaption { color: var(--dim); }
  .stale { color: var(--bad); }
  .card.box { cursor: default; }
  .thumb { position: relative; display: inline-block; max-width: 100%; }
  .thumb img { display: block; max-width: 100%; max-height: 180px; }
  .thumb .inset { position: absolute; border: 1px dashed var(--hot); pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>ASSET CATALOGUE</h1>
  <input id="q" placeholder="search — words: steel worktop, glass, drawer…  ( / )" autocomplete="off">
  <select id="sort" title="order">
    <option value="group">by kind</option><option value="name">by name</option>
    <option value="worn">most worn</option><option value="cost">dearest</option><option value="new">newest</option>
  </select>
  <span class="row" id="views"><button data-view="grid">catalogue</button><button data-view="notes">notes</button>
    <button data-view="ledger">ledger</button></span>
  <span id="spend" class="dim"></span>
  <span id="status" class="dim"></span>
</header>
<aside id="filters"></aside>
<main id="list"></main>
<section id="detail">
  <div id="head"></div>
  <div id="stage" class="none">
    <canvas id="gl"></canvas>
    <div id="hud"><span id="cam"></span><br><span id="pick"></span></div>
    <canvas id="gizmo" width="140" height="140"></canvas>
    <div id="error"></div>
    <div id="stagebar" class="row">
      <span id="camviews" class="row"></span>
      <button id="flat" title="L">flat</button><button id="edges" title="E">edges</button>
      <button id="grid3d" class="on" title="G">grid</button><button id="box" class="on" title="B">bounds</button>
      <button id="fit" title="F">fit</button>
      <span class="dim" title="drag orbit · shift/right-drag pan · wheel zoom · 1–6 views · click a part · H hide it">?</span>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="tab"></div>
</section>
<script>
'use strict';
const $ = id => document.getElementById(id);
// An element with its attributes and children; text is set as text, never as markup.
function h(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e[k] = v; else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
const store = (key, value) => localStorage.setItem(`catalog:${key}`, JSON.stringify(value));
const stored = (key, fallback) => { try { return JSON.parse(localStorage.getItem(`catalog:${key}`)) ?? fallback; } catch { return fallback; } };

// ---------------------------------------------------------------- the 3D view: one model, its faces and parts
const canvas = $('gl');
const gl = canvas.getContext('webgl2', { antialias: true });
const show = { flat: false, edges: false, grid3d: true, box: true };
let data = null, catalog = null, current = null, scene = null, hover = -1, selected = -1, hidden = new Set();
let lit = [], hoverLit = [];   // texture indices of the shown model to light: the asset looked at, and one hovered
let cam = { az: -45, el: 35, px: 200, target: [0.5, 0.5, 0.25] };

const MESH_VS = `#version 300 es
in vec3 aPos; in vec3 aNorm; in vec3 aFace; in vec2 aUv; in vec3 aBary; in float aPart; in float aTex;
uniform mat4 uView; uniform float uTie;
out vec3 vNorm; out vec3 vFace; out vec2 vUv; out vec3 vBary; flat out float vPart; flat out float vTex;
void main() {
  gl_Position = uView * vec4(aPos, 1.0);
  gl_Position.z -= aPart * uTie;   // the later part shows where two faces share a plane, as the render's TIE_M
  vNorm = aNorm; vFace = aFace; vUv = aUv; vBary = aBary; vPart = aPart; vTex = aTex;
}`;
const MESH_FS = `#version 300 es
precision highp float;
in vec3 vNorm; in vec3 vFace; in vec2 vUv; in vec3 vBary; flat in float vPart; flat in float vTex;
uniform sampler2D uTex; uniform vec3 uToward; uniform vec3 uSun;
uniform float uAmbient, uShade, uHover, uSelect, uCutoutAlpha;
uniform float uLit[16]; uniform int uLitCount; uniform float uHot[16]; uniform int uHotCount;
uniform bool uCutout, uFlat, uEdges;
out vec4 colour;
bool among(float t, float list[16], int count) {
  for (int i = 0; i < 16; i++) { if (i >= count) break; if (abs(t - list[i]) < 0.5) return true; }
  return false;
}
void main() {
  if (dot(vFace, uToward) <= 0.0) discard;   // one-sided, as the render: a quad shows from its front alone
  vec4 t = texture(uTex, vUv);
  if (uCutout && t.a < uCutoutAlpha) discard;
  float lit = uFlat ? 1.0 : uAmbient + (1.0 - uAmbient) * max(dot(normalize(vNorm), uSun), 0.0);
  vec3 c = t.rgb * lit * uShade;
  if (uLitCount > 0 && !among(vTex, uLit, uLitCount)) c = mix(c, vec3(0.12), 0.65);
  if (abs(vPart - uSelect) < 0.5) c = mix(c, vec3(0.25, 0.7, 0.9), 0.4);
  if (abs(vPart - uHover) < 0.5 || among(vTex, uHot, uHotCount)) c = mix(c, vec3(1.0, 0.7, 0.2), 0.45);
  if (uEdges) {
    vec3 a = smoothstep(vec3(0.0), fwidth(vBary) * 1.2, vBary);
    c = mix(vec3(0.3, 1.0, 0.5), c, min(min(a.x, a.y), a.z));
  }
  colour = vec4(c, 1.0);
}`;
const LINE_VS = `#version 300 es
in vec3 aPos; uniform mat4 uView;
void main() { gl_Position = uView * vec4(aPos, 1.0); }`;
const LINE_FS = `#version 300 es
precision highp float; uniform vec4 uColour; out vec4 colour;
void main() { colour = uColour; }`;

function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, text] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, text); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name.replace('[0]', '')] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}
const meshProgram = program(MESH_VS, MESH_FS);
const lineProgram = program(LINE_VS, LINE_FS);

// The heavy data, each a script under viewer-cache/ named by its content: loaded once, when first needed.
const scripts = new Map(), images = new Map(), geometries = new Map();
function need(src) {
  if (!scripts.has(src)) scripts.set(src, new Promise((done, failed) => {
    const s = h('script', { src });
    s.onload = () => { s.remove(); done(); };
    s.onerror = () => { s.remove(); scripts.delete(src); failed(new Error(`could not load ${src}`)); };
    document.body.append(s);
  }));
  return scripts.get(src);
}
const TYPES = { float32: Float32Array, uint16: Uint16Array, int8: Int8Array };
window.shapesImage = (key, uri) => images.set(key, uri);
window.shapesGeometry = (key, arrays) => geometries.set(key, Object.fromEntries(Object.entries(arrays).map(
  ([name, { type, b64 }]) => [name, new TYPES[type](Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer)])));

// Textures by picture and wrap, uploaded once a picture decodes; grey until then.
const textures = new Map();
function texture(model, image, wrap) {
  const key = `${image}|${wrap}`;
  if (textures.has(key)) return textures.get(key);
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([128, 128, 128, 255]));
  const picture = new Image();
  picture.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, picture);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    const mode = wrap ? gl.REPEAT : gl.CLAMP_TO_EDGE;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, mode);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, mode);
    draw();
  };
  need(model.images[image]).then(() => { picture.src = images.get(image); });
  textures.set(key, t);
  return t;
}

// The model's triangles, the hidden parts left out, ordered by look so each look is one draw.
function buildScene(model) {
  const order = [...model.part.keys()].filter(t => !hidden.has(model.part[t]))
    .sort((a, b) => model.look[a] - model.look[b]);
  const n = order.length * 3;
  const pos = new Float32Array(n * 3), norm = new Float32Array(n * 3), face = new Float32Array(n * 3);
  const uv = new Float32Array(n * 2), bary = new Float32Array(n * 3), part = new Float32Array(n);
  const tex = new Float32Array(n);
  const draws = [];
  order.forEach((t, i) => {
    const P = model.P.slice(t * 9, t * 9 + 9), N = model.N.slice(t * 9, t * 9 + 9);
    const e1 = [P[3] - P[0], P[4] - P[1], P[5] - P[2]], e2 = [P[6] - P[0], P[7] - P[1], P[8] - P[2]];
    let g = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
    const m = [N[0] + N[3] + N[6], N[1] + N[4] + N[7], N[2] + N[5] + N[8]];
    const flip = dot(g, m) < 0 ? -1 : 1, length = Math.hypot(...g) || 1;
    g = g.map(c => c / length * flip);
    pos.set(P, i * 9); norm.set(N, i * 9);
    for (let k = 0; k < 3; k++) {
      face.set(g, i * 9 + k * 3);
      bary[i * 9 + k * 3 + k] = 1;
      part[i * 3 + k] = model.part[t];
      tex[i * 3 + k] = model.looks[model.look[t]].tex;
    }
    uv.set(model.UV.slice(t * 6, t * 6 + 6), i * 6);
    const look = model.look[t];
    if (!draws.length || draws.at(-1).look !== look) draws.push({ look, first: i * 3, count: 0 });
    draws.at(-1).count += 3;
  });
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  for (const [name, array, size] of [['aPos', pos, 3], ['aNorm', norm, 3], ['aFace', face, 3], ['aUv', uv, 2],
                                     ['aBary', bary, 3], ['aPart', part, 1], ['aTex', tex, 1]]) {
    const at = gl.getAttribLocation(meshProgram.p, name);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, array, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(at);
    gl.vertexAttribPointer(at, size, gl.FLOAT, false, 0, 0);
  }
  return { vao, draws, lines: buildLines(model) };
}

function buildLines(model) {
  const [lo, hi] = model.extent;
  const grid = [];
  const x0 = Math.floor(Math.min(lo[0], 0)) - 1, x1 = Math.ceil(Math.max(hi[0], 1)) + 1;
  const y0 = Math.floor(Math.min(lo[1], 0)) - 1, y1 = Math.ceil(Math.max(hi[1], 1)) + 1;
  const z = -0.001;
  for (let x = x0; x <= x1; x++) grid.push(x, y0, z, x, y1, z);
  for (let y = y0; y <= y1; y++) grid.push(x0, y, z, x1, y, z);
  const box = [];
  if (model.bounds) {
    const [a, b] = model.bounds;
    const c = i => [i & 1 ? b[0] : a[0], i & 2 ? b[1] : a[1], i & 4 ? b[2] : a[2]];
    for (let i = 0; i < 8; i++) for (const bit of [1, 2, 4]) if (!(i & bit)) box.push(...c(i), ...c(i | bit));
  }
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([...grid, ...box]), gl.STATIC_DRAW);
  const at = gl.getAttribLocation(lineProgram.p, 'aPos');
  gl.enableVertexAttribArray(at);
  gl.vertexAttribPointer(at, 3, gl.FLOAT, false, 0, 0);
  return { vao, grid: grid.length / 3, box: box.length / 3 };
}

// The camera, as the render's: azimuth from south toward east, elevation above the horizon, orthographic.
function axes() {
  const a = cam.az * Math.PI / 180, e = cam.el * Math.PI / 180;
  const t = [Math.cos(e) * Math.sin(a), -Math.cos(e) * Math.cos(a), Math.sin(e)];
  const r = [Math.cos(a), Math.sin(a), 0];
  const u = [t[1] * r[2] - t[2] * r[1], t[2] * r[0] - t[0] * r[2], t[0] * r[1] - t[1] * r[0]];
  return { t, r, u };
}
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function viewMatrix() {
  const { t, r, u } = axes(), c = cam.target, ratio = devicePixelRatio;
  const sx = 2 * cam.px * ratio / canvas.width, sy = 2 * cam.px * ratio / canvas.height;
  const [lo, hi] = current.extent;
  const sz = 1 / (Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) + 4);
  const rows = [[...r.map(v => v * sx), -sx * dot(r, c)], [...u.map(v => v * sy), -sy * dot(u, c)],
                [...t.map(v => -v * sz), sz * dot(t, c)], [0, 0, 0, 1]];
  const m = new Float32Array(16);
  for (let row = 0; row < 4; row++) for (let col = 0; col < 4; col++) m[col * 4 + row] = rows[row][col];
  return m;
}
const padded = list => { const out = new Float32Array(16); list.slice(0, 16).forEach((v, i) => { out[i] = v; }); return out; };

function draw() {
  if (!canvas.clientWidth) return;
  const w = Math.round(canvas.clientWidth * devicePixelRatio), hgt = Math.round(canvas.clientHeight * devicePixelRatio);
  if (canvas.width !== w || canvas.height !== hgt) { canvas.width = w; canvas.height = hgt; }
  gl.viewport(0, 0, w, hgt);
  gl.clearColor(0.17, 0.17, 0.17, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (!scene) return;
  gl.enable(gl.DEPTH_TEST);
  const view = viewMatrix(), { t } = axes();

  gl.useProgram(meshProgram.p);
  const u = meshProgram.u;
  gl.uniformMatrix4fv(u.uView, false, view);
  gl.uniform1f(u.uTie, 2e-6);
  gl.uniform3fv(u.uToward, t);

function drawGizmo() {
  const g = $('gizmo').getContext('2d'), { r, u } = axes();

  g.lineWidth = 3;

    const x = 70 + dot(v, r) * 46, y = 70 - dot(v, u) * 46;
    g.strokeStyle = g.fillStyle = colour;
    g.beginPath(); g.moveTo(70, 70); g.lineTo(x, y); g.stroke();

function fit() {
  const [lo, hi] = current.bounds || current.extent;
  cam.target = lo.map((v, i) => (v + hi[i]) / 2);
  const span = Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) || 1;
  cam.px = 0.8 * Math.min(canvas.clientWidth, canvas.clientHeight) / span;
}

// The part under a point of the canvas: the nearest triangle there, hidden parts and back faces skipped.
function pick(clientX, clientY) {
  const box = canvas.getBoundingClientRect();
  const x = (clientX - box.left) / box.width * 2 - 1, y = 1 - (clientY - box.top) / box.height * 2;
  const m = viewMatrix(), { t } = axes();
  let best = -1, nearest = Infinity;
  const P = current.P, N = current.N;
  for (let tri = 0; tri < current.part.length; tri++) {
    if (hidden.has(current.part[tri])) continue;
    const n = [0, 1, 2].map(k => N[tri * 9 + k] + N[tri * 9 + 3 + k] + N[tri * 9 + 6 + k]);
    if (dot(n, t) <= 0) continue;
    const s = [0, 1, 2].map(k => {
      const p = [P[tri * 9 + k * 3], P[tri * 9 + k * 3 + 1], P[tri * 9 + k * 3 + 2]];
      return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13],
              m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14]];
    });
    const area = (s[1][0] - s[0][0]) * (s[2][1] - s[0][1]) - (s[2][0] - s[0][0]) * (s[1][1] - s[0][1]);
    if (Math.abs(area) < 1e-12) continue;
    const w0 = ((s[1][0] - x) * (s[2][1] - y) - (s[2][0] - x) * (s[1][1] - y)) / area;
    const w1 = ((s[2][0] - x) * (s[0][1] - y) - (s[0][0] - x) * (s[2][1] - y)) / area;
    const w2 = 1 - w0 - w1;
    if (w0 < 0 || w1 < 0 || w2 < 0) continue;
    const z = w0 * s[0][2] + w1 * s[1][2] + w2 * s[2][2] - current.part[tri] * 2e-6;
    if (z < nearest) { nearest = z; best = current.part[tri]; }
  }
  return best;
}

// Words as the catalogue files them (_catalog.words): lowercased, short and common ones dropped, a plural's s.
const STOP = new Set(`a an and the of to in on at by for with from into its it is as or but than then this that these
those each every one two three four five six seven eight nine all any no not nothing only also again same very more
most seen face faces straight down up left right top bottom edge edges side sides square wide tall twice half times
swatch swatches filling fills fill touching plain faint fine dull slightly small large long short thin thick narrow
broad evenly even soft repeating repeat whole rest outside inside round along across over under behind between near
middle centre center corner corners fully transparent`.split(/\s+/));
function words(text) {
  return (text.toLowerCase().replace(/_/g, ' ').match(/[a-z0-9]+/g) ?? [])
    .filter(w => w.length >= 3 && !STOP.has(w) && !/^\d+$/.test(w))
    .map(w => w.length > 3 && w.endsWith('s') && !w.endsWith('ss') ? w.slice(0, -1) : w);
}
let bags = new Map(), rarity = new Map();
function index() {
  bags = new Map(catalog.entries.map(e => [e.id, {
    filed: new Set(words([e.id, e.kind, e.material ?? '', ...(e.sets ?? []), ...(e.fits ?? []), ...(e.tags ?? [])].join(' '))),
    about: new Set(words(e.about ?? '')) }]));
}
function score(e) {
  const asked = words(F.q);
  if (!asked.length) return 1;
  const { filed, about } = bags.get(e.id), n = bags.size;
  let total = 0;
  for (const w of asked) {
    if (!rarity.has(w)) rarity.set(w, Math.log((1 + n) / (1 + [...bags.values()].filter(b => b.filed.has(w) || b.about.has(w)).length)) + 1);
    const r = rarity.get(w);
    if (filed.has(w)) total += 3 * r;
    else if (about.has(w)) total += r;
    else if ([...filed].some(f => f.startsWith(w))) total += 1.5 * r;
    else if ([...about].some(a => a.startsWith(w))) total += 0.5 * r;
  }
  return total;
}
// An entry the filters keep: within a facet any chosen value, across facets every facet; `skip` leaves one out,

function kept(e, skip) {

    if (!values(e).some(v => F[facet].includes(v))) return false;
  }
  if (skip !== 'flags' && F.flags.some(f => !FLAGS[f][1](e))) return false;
  return true;
}
function listed() {

  const by = {

    worn: (a, b) => (b[1].users?.length ?? 0) - (a[1].users?.length ?? 0) || a[1].id.localeCompare(b[1].id),
    cost: (a, b) => nowCost(b[1]) - nowCost(a[1]),

  };

  return out.sort(sorter).map(([, e]) => e);
}

function toggle(facet, value) {

canvas.addEventListener('pointerdown', e => {
  dragging = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 2, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!current) return;
  if (!dragging) { setHover(pick(e.clientX, e.clientY)); return; }
  const dx = e.clientX - dragging.x, dy = e.clientY - dragging.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) dragging.moved = true;
  dragging.x = e.clientX; dragging.y = e.clientY;
  if (dragging.pan) {
    const { r, u } = axes();
    cam.target = cam.target.map((c, i) => c - (r[i] * dx - u[i] * dy) / cam.px);
  } else {
    cam.az = ((cam.az - dx * 0.4 + 540) % 360) - 180;
    cam.el = Math.max(-89, Math.min(90, cam.el + dy * 0.4));
  }
  draw();
});
canvas.addEventListener('pointerleave', () => { if (current && !dragging) setHover(-1); });
canvas.addEventListener('pointerup', e => {
  if (dragging && !dragging.moved && e.button === 0 && current) selectPart(pick(e.clientX, e.clientY));
  dragging = null;
  saveCamera();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.px *= Math.pow(1.0015, -e.deltaY);
  saveCamera(); draw();
}, { passive: false });
addEventListener('keydown', e => {
  if (!data) return;
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); return; }
  if (e.target !== document.body) { if (e.key === 'Escape') e.target.blur(); return; }
  const views = ['iso', 'rear', 'device', 'top', 'front', 'side'];
  if (e.key >= '1' && e.key <= '6') setView(views[e.key - 1]);
  const keys = { l: 'flat', e: 'edges', g: 'grid3d', b: 'box' };
  if (keys[e.key]) flip(keys[e.key]);
  if (e.key === 'f') $('fit').click();
  if (e.key === 'h' && selected >= 0) toggleHidden(selected);
  if (e.key === 'Escape') selectPart(-1);
});
addEventListener('resize', draw);
</script>
<script src="viewer-data.js"></script>
</body>
